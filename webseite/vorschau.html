<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handy-Ansicht – Pizzeria Gabriel's</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c8553d'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23f3d9a4'/%3E%3C/svg%3E">
<style>
  :root { --grund: #1d1b19; --text: #f4efe8; --leise: #b9b0a5; --akzent: #e07a4f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--grund); color: var(--text); font: 15px/1.4 system-ui, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 980px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
           justify-content: space-between; padding: 12px 16px; }
  header a.zurueck { color: var(--leise); text-decoration: none; }
  header a:hover { color: var(--text); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav a { color: var(--text); text-decoration: none; padding: 5px 11px; border: 1px solid #47413b; border-radius: 99px; }
  nav a[aria-current="page"] { background: var(--akzent); border-color: var(--akzent); color: #1d1b19; font-weight: 600; }
  nav a:hover { border-color: var(--akzent); }
  .buehne { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 16px 20px; gap: 28px; }
  .handy { width: 390px; height: min(844px, calc(100vh - 120px)); border: 12px solid #0b0b0b; border-radius: 46px;
           background: #0b0b0b; box-shadow: 0 0 0 2px #3a3633, 0 30px 60px rgba(0,0,0,.5); overflow: hidden; position: relative; }
  .handy::before { content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 110px; height: 28px;
                   background: #0b0b0b; border-radius: 20px; z-index: 2; }
  .handy iframe { width: 100%; height: 100%; border: 0; border-radius: 34px; background: #fff; }
  .info { max-width: 300px; color: var(--leise); }
  .info h1 { color: var(--text); font-size: 22px; margin: 0 0 6px; }
  .info a { color: var(--akzent); }
  @media (max-width: 760px) { .info { display: none; } }
  @media (max-width: 440px) { .handy { width: 100%; border-width: 8px; border-radius: 30px; } .handy::before { display: none; } }
</style>
</head>
<body>
<header>
  <a class="zurueck" href="index.html">← Alle Entwürfe</a>
  <nav id="wahl" aria-label="Entwurf wählen"></nav>
</header>
<div class="buehne">
  <div class="handy"><iframe id="seite" title="Handy-Ansicht des Entwurfs"></iframe></div>
  <div class="info">
    <h1 id="titel"></h1>
    <p id="text"></p>
    <p>So sieht die Seite auf einem iPhone aus. Im Rahmen lässt sich scrollen und tippen wie am Handy.</p>
    <p><a id="pc" href="#">Diesen Entwurf am PC ansehen →</a></p>
  </div>
</div>
<script>
  var ENTWUERFE = [
    ["Trattoria Klassik", "Warm, zeitlos, wie eine gedruckte Restaurantkarte."],
    ["Modern & Dunkel", "Dunkel, kräftig, mit großem Pizzafoto."],
    ["Frisch & Praktisch", "Hell und schnell, mit Suche in der Speisekarte."],
    ["Kreidetafel & Holz", "Handgemacht, Speisekarte wie die Tafel an der Wand."],
    ["Editorial Olive", "Elegant wie ein Food-Magazin."]
  ];
  var n = parseInt(new URLSearchParams(location.search).get("v"), 10);
  if (!(n >= 1 && n <= 5)) n = 1;
  document.getElementById("seite").src = "variante-" + n + ".html";
  document.getElementById("titel").textContent = n + " · " + ENTWUERFE[n - 1][0];
  document.getElementById("text").textContent = ENTWUERFE[n - 1][1];
  document.getElementById("pc").href = "variante-" + n + ".html";
  document.title = "Handy-Ansicht " + n + " – Pizzeria Gabriel's";
  var nav = document.getElementById("wahl");
  ENTWUERFE.forEach(function (e, i) {
    var a = document.createElement("a");
    a.href = "?v=" + (i + 1); a.textContent = (i + 1) + " " + e[0]; a.title = e[1];
    if (i + 1 === n) a.setAttribute("aria-current", "page");
    nav.appendChild(a);
  });
  /* Auf einem echten Handy den Entwurf direkt öffnen statt im Rahmen */
  if (window.matchMedia("(max-width: 500px)").matches && !/rahmen=1/.test(location.search)) location.replace("variante-" + n + ".html");
</script>
</body>
</html>
