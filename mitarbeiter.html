<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mitarbeiter-App</title>
</head>
<body style="margin:0;background:#fff;color:#000;font:16px system-ui,sans-serif;text-align:left;padding:16px">
<p>Mitarbeiter-App wird geöffnet …</p>
<script src="js/kern.js?v=7"></script>
<script>
/* Vorführung: öffnet die Mitarbeiter-App sofort ohne Namensauswahl und PIN,
   angemeldet als erster Beispiel-Mitarbeiter (Daten nur auf diesem Gerät). */
Kern.bereit.then(function () {
  var leute = Kern.maListe(false).filter(function (m) { return !m.ist_chef && m.zugangscode; });
  var deutsch = leute.filter(function (m) { return (m.sprache || 'de') === 'de'; });
  /* Persönlicher Testlink: mitarbeiter.html?name=Bettina oder ?name=Valeria.
     Beim ersten Öffnen auf dem Gerät auf Deutsch, danach bleibt die eigene Sprachwahl. */
  var wunsch = (new URLSearchParams(location.search).get('name') || '').trim().toLowerCase();
  var benannt = wunsch ? leute.filter(function (m) { return m.name.toLowerCase() === wunsch; })[0] : null;
  if (benannt) {
    var merker = 'pp_testlink_' + wunsch, schonDa = false;
    try { schonDa = !!localStorage.getItem(merker); localStorage.setItem(merker, '1'); } catch (e) { /* egal */ }
    if (!schonDa && benannt.sprache !== 'de') {
      try { Kern.maSpeichern(Object.assign({}, benannt, { sprache: 'de' })); } catch (e) { /* nicht schlimm */ }
    }
  }
  var person = benannt || deutsch[0] || leute[0];
  var ziel = person ? 'team.html?k=' + encodeURIComponent(person.zugangscode) : 'team.html';
  if (!person) { location.replace(ziel); return; }
  /* Die Beispieldaten werden kurz verzögert im Gerät gespeichert. Erst weiterleiten,
     wenn sie dort angekommen sind, sonst gilt der Zugang auf der nächsten Seite nicht. */
  var ende = Date.now() + 4000;
  function gespeichert() {
    return new Promise(function (fertig) {
      try {
        var a = indexedDB.open('pizzaplan', 2);
        a.onerror = function () { fertig(false); };
        a.onsuccess = function () {
          try {
            var t = a.result.transaction('kv', 'readonly').objectStore('kv').getAll();
            t.onsuccess = function () {
              a.result.close();
              fertig(t.result.some(function (w) { return String(w).indexOf(person.zugangscode) >= 0; }));
            };
            t.onerror = function () { a.result.close(); fertig(false); };
          } catch (e) { fertig(false); }
        };
      } catch (e) { fertig(false); }
    });
  }
  function warten() {
    gespeichert().then(function (ok) {
      if (ok || Date.now() > ende) location.replace(ziel);
      else setTimeout(warten, 100);
    });
  }
  setTimeout(warten, 300);
}).catch(function () { location.replace('team.html'); });
</script>
</body>
</html>
