<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PizzaPlan · Handy</title>
<meta name="theme-color" content="#b5322a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PizzaPlan">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/basis.css?v=2">
<link rel="stylesheet" href="css/handy.css?v=2">
</head>
<body>

<!-- ===================================================== Anmeldung ===== -->
<div id="anmeldung" class="anmeldung" style="display:none">
  <div class="karte" style="text-align:center">
    <div style="font-size:46px">🍕</div>
    <h1 id="anmeldung_betrieb">PizzaPlan</h1>
    <p style="color:var(--text-leise);margin-top:-4px">Personal &amp; Dienstplan</p>
    <div style="text-align:left;margin-top:14px">
      <label data-t="chef_pin">Chef-PIN</label>
      <input id="pin_feld" class="pinfeld" type="password" inputmode="numeric" maxlength="8"
             autocomplete="off" placeholder="••••" readonly>
    </div>
    <div class="zifferblock" id="ziffern"></div>
    <button class="haupt gross" id="pin_knopf" style="margin-top:12px" data-t="anmelden">Anmelden</button>
    <p id="pin_fehler" class="hinweis rot" style="display:none;margin-top:12px"></p>
    <p style="font-size:12.5px;color:var(--text-leise);margin-top:16px">
      <a href="team.html">Zur Mitarbeiter-App</a> · <a href="pc.html">PC-Fassung</a></p>
  </div>
</div>

<!-- ==================================================== Anwendung ====== -->
<div id="haupt" style="display:none">

  <div class="kopf">
    <div class="zeichen">🍕</div>
    <div class="name" id="kopf_titel">PizzaPlan<small id="kopf_betrieb"></small></div>
    <div class="rechts">
      <button type="button" id="knopf_mikro" class="rund" title="Sprachbefehl">🎤</button>
      <button type="button" id="knopf_sprache">DE</button>
      <button type="button" id="knopf_schema" class="rund">🌙</button>
    </div>
  </div>

  <div class="inhalt">

    <!-- ------------------------------------------------ Heute -------- -->
    <div class="seite an" id="s_heute">
      <div class="kacheln" id="h_kacheln"></div>
      <div class="schnellknoepfe">
        <button type="button" id="h_schicht"><span class="bild">➕</span>
          <span data-t="schicht_neu">+ Schicht</span></button>
        <button type="button" id="h_frei"><span class="bild">✋</span>
          <span data-t="wuensche_kurz">Wünsche</span></button>
        <button type="button" id="h_freigeben"><span class="bild">📣</span>
          <span data-t="plan_freigeben">Plan freigeben</span></button>
        <button type="button" id="h_versand"><span class="bild">📤</span>
          <span data-t="versand_kurz">Verschicken</span></button>
      </div>
      <div class="abschnitt" data-t="heute_im_dienst">Heute im Dienst</div>
      <div id="h_heute"></div>
      <div class="abschnitt" data-t="gerade_gestempelt">Gerade eingestempelt</div>
      <div id="h_stempel"></div>
      <div class="abschnitt" data-t="naechste_termine">Nächste Termine</div>
      <div id="h_termine"></div>
    </div>

    <!-- ------------------------------------------------ Plan --------- -->
    <div class="seite" id="s_plan">
      <div class="streifen">
        <button type="button" id="pl_zurueck">‹</button>
        <button type="button" id="pl_heute" data-t="heute">Heute</button>
        <button type="button" id="pl_vor">›</button>
        <div style="flex:1"></div>
        <button type="button" id="pl_woche" data-t="woche_knopf">Woche</button>
      </div>
      <div class="tagesband" id="pl_band"></div>
      <div id="pl_titel" style="font-weight:600;font-size:16px;margin:2px 0 10px"></div>
      <div class="wischhinweis" data-t="wischen_tag"></div>
      <div id="pl_liste"></div>
      <button type="button" class="haupt gross" id="pl_neu" style="margin-top:12px"
        data-t="schicht_neu">+ Schicht</button>
    </div>

    <!-- ------------------------------------------------ Team --------- -->
    <div class="seite" id="s_team">
      <div class="feld"><input id="tm_suche" data-t-platz="suchen" autocomplete="off"></div>
      <div id="tm_liste"></div>
      <button type="button" class="haupt gross" id="tm_neu" style="margin-top:12px"
        data-t="ma_neu">+ Mitarbeiter</button>
      <button type="button" class="gross" id="tm_einlesen" style="margin-top:9px"
        data-t="einlesen">Mitarbeiter einlesen</button>
    </div>

    <!-- ------------------------------------------------ Zeiten ------- -->
    <div class="seite" id="s_zeiten">
      <div class="streifen" id="ze_streifen">
        <button type="button" data-tage="7" class="an" data-t="tage7">7 Tage</button>
        <button type="button" data-tage="14" data-t="tage14">14 Tage</button>
        <button type="button" data-tage="30" data-t="tage30">30 Tage</button>
      </div>
      <div id="ze_summe" class="hinweis"></div>
      <div id="ze_liste"></div>
      <button type="button" class="gross" id="ze_freigeben" style="margin-top:12px"
        data-t="alle_freigeben">Alle prüfen und freigeben</button>
      <button type="button" class="gross" id="ze_neu" style="margin-top:9px"
        data-t="zeit_neu">+ Zeit nachtragen</button>
    </div>

    <!-- ------------------------------------------------ Mehr --------- -->
    <div class="seite" id="s_mehr">

      <div class="streifen" id="me_streifen">
        <button type="button" data-teil="wuensche" class="an" data-t="wuensche_kurz">Wünsche</button>
        <button type="button" data-teil="termine" data-t="termine">Termine</button>
        <button type="button" data-teil="auswertung" data-t="auswertung">Auswertung</button>
        <button type="button" data-teil="versand" data-t="versand_kurz">Verschicken</button>
        <button type="button" data-teil="einlesen" data-t="einlesen_kurz">Einlesen</button>
        <button type="button" data-teil="einstellungen" data-t="einstellungen">Einstellungen</button>
      </div>

      <!-- Wünsche -->
      <div class="teil an" id="t_wuensche">
        <div class="streifen" id="wu_streifen">
          <button type="button" data-status="offen" class="an" data-t="offen">offen</button>
          <button type="button" data-status="" data-t="alle">alle</button>
          <button type="button" data-status="genehmigt" data-t="genehmigt">genehmigt</button>
        </div>
        <div id="wu_liste"></div>
        <button type="button" class="haupt gross" id="wu_neu" style="margin-top:12px"
          data-t="wunsch_neu">+ Eintrag</button>
      </div>

      <!-- Termine -->
      <div class="teil" id="t_termine">
        <div class="mikro">
          <button type="button" id="te_mikro">🎤</button>
          <div class="text"><b data-t="termin_sprechen">Termin einfach sprechen</b>
            <span id="te_status" data-t="termin_beispiel"></span></div>
        </div>
        <div id="te_liste"></div>
        <button type="button" class="haupt gross" id="te_neu" style="margin-top:12px"
          data-t="termin_neu">+ Neuer Termin</button>
      </div>

      <!-- Auswertung -->
      <div class="teil" id="t_auswertung">
        <div class="feld"><label data-t="monat">Monat</label><input type="month" id="au_monat"></div>
        <div id="au_inhalt"></div>
        <button type="button" class="gross" id="au_csv" style="margin-top:10px"
          data-t="als_datei">Als Excel-Datei</button>
      </div>

      <!-- Versand -->
      <div class="teil" id="t_versand">
        <div class="feldreihe">
          <div class="feld"><label data-t="von">Von</label><input type="date" id="vs_von"></div>
          <div class="feld"><label data-t="bis">Bis</label><input type="date" id="vs_bis"></div>
        </div>
        <div class="feld"><label data-t="weg">Weg</label>
          <select id="vs_weg">
            <option value="whatsapp">WhatsApp</option>
            <option value="email">E-Mail</option>
          </select></div>
        <div class="abschnitt" data-t="empfaenger">Wer bekommt seinen Plan?</div>
        <div id="vs_empfaenger"></div>
        <button type="button" class="haupt gross" id="vs_start" style="margin-top:12px"
          data-t="jetzt_verschicken">Jetzt verschicken</button>
        <button type="button" class="gross" id="vs_gesamt" style="margin-top:9px"
          data-t="gesamtplan">Gesamtplan zum Aushängen</button>
      </div>

      <!-- Einlesen -->
      <div class="teil" id="t_einlesen">
        <p style="font-size:14.5px" data-t="einlesen_text"></p>
        <button type="button" class="haupt gross" id="ei_datei" data-t="datei_waehlen">Datei auswählen</button>
        <input type="file" id="ei_dateifeld" accept=".csv,.txt,.tsv,text/csv,text/plain"
               style="display:none">
        <div class="feld" style="margin-top:12px">
          <label data-t="einfuegen_hier">… oder Tabelle hier einfügen</label>
          <textarea id="ei_text" rows="7" spellcheck="false"
            style="font-family:Consolas,monospace;font-size:13px"></textarea>
        </div>
        <button type="button" class="haupt gross" id="ei_pruefen" data-t="pruefen">Prüfen</button>
        <button type="button" class="gross" id="ei_vorlage" style="margin-top:9px"
          data-t="vorlage_holen">Importvorlage herunterladen</button>
        <div id="ei_ergebnis"></div>
      </div>

      <!-- Einstellungen -->
      <div class="teil" id="t_einstellungen">
        <div class="karte">
          <h3 data-t="betrieb_titel">Betrieb</h3>
          <div class="feld"><label data-t="betrieb">Name des Betriebs</label><input id="es_betrieb"></div>
          <div class="feld"><label data-t="chef_pin">Chef-PIN</label><input id="es_chef_pin" maxlength="8"></div>
          <div class="feld"><label data-t="positionen">Positionen</label><input id="es_positionen"></div>
        </div>
        <div class="karte">
          <h3 data-t="arbeitszeit">Arbeitszeit und Lohn</h3>
          <div id="es_regler"></div>
        </div>
        <button type="button" class="haupt gross" id="es_speichern" data-t="speichern">Speichern</button>
        <div class="karte" style="margin-top:14px">
          <h3 data-t="daten">Daten</h3>
          <button type="button" class="gross" id="es_sicherung" data-t="sicherung">Sicherungskopie anlegen</button>
          <button type="button" class="gross" id="es_beispiel" style="margin-top:9px"
            data-t="beispiel_weg">Beispieldaten entfernen</button>
          <p style="font-size:12.5px;color:var(--text-leise);margin-top:10px" id="es_ort"></p>
        </div>
        <button type="button" class="gross" id="es_abmelden" style="margin-top:6px"
          data-t="abmelden">Abmelden</button>
        <p style="text-align:center;font-size:12.5px;color:var(--text-leise);margin-top:14px">
          <a href="pc.html">PC-Fassung</a> · <a href="team.html">Mitarbeiter-App</a></p>
      </div>

    </div>
  </div>

  <div class="fussleiste" id="fussleiste">
    <button type="button" data-seite="heute" class="an"><span class="bild">🏠</span>
      <span data-t="heute">Heute</span></button>
    <button type="button" data-seite="plan"><span class="bild">📅</span>
      <span data-t="dienstplan">Dienstplan</span></button>
    <button type="button" data-seite="team"><span class="bild">👥</span>
      <span data-t="team">Team</span></button>
    <button type="button" data-seite="zeiten"><span class="bild">⏱</span>
      <span data-t="zeiten_kurz">Zeiten</span></button>
    <button type="button" data-seite="mehr"><span class="bild">⋯</span>
      <span data-t="mehr">Mehr</span></button>
  </div>
</div>

<script>
  window.__ppFehler = null;
  window.addEventListener('error', function (e) {
    if (!window.__ppFehler) {
      window.__ppFehler = (e.message || 'unbekannt') + '  ['
        + String(e.filename || '').split('/').pop() + ' Zeile ' + (e.lineno || 0) + ']';
    }
  }, true);
</script>
<script src="js/kern.js?v=2"></script>
<script src="js/sprache.js?v=2"></script>
<script src="js/oberflaeche.js?v=2"></script>
<script src="js/masken.js?v=2"></script>
<script src="js/handy.js?v=2"></script>
<script>
  if (typeof Kern === 'undefined' || typeof Handy === 'undefined') {
    document.body.innerHTML = '<div style="font-family:system-ui;padding:20px">'
      + '<h2>PizzaPlan konnte nicht starten</h2><p style="font-family:monospace;font-size:13px">'
      + (window.__ppFehler || 'kein Grund gemeldet') + '</p></div>';
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
